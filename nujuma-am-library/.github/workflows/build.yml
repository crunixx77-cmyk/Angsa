name: Build Android Library

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android Library
      run: ./gradlew build

    - name: Upload Build Artifacts (AAR)
      uses: actions/upload-artifact@v4
      with:
        name: nujuma-am-library-aar
        path: nujuma-am-library/build/outputs/aar/
