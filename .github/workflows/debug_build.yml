name: Build

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2022.08.1
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Preparing gradlew permissions"
          chmod +x gradlew

          echo "Building APKs"
          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"

          echo "Validating and capturing APK dynamically"
          BUILT_APK=$(ls "$APK_DIR_PATH"/*_arm64-v8a.apk 2>/dev/null | head -n 1)

          if [ -z "$BUILT_APK" ]; then
            files_found="$(ls -R "$APK_DIR_PATH" 2>/dev/null || echo "Directory empty or missing")"
            exit_on_error "Failed to find any arm64-v8a APK. Files found: "$'\n'$files_found
          fi

          echo "Found APK: $BUILT_APK"
          
          APK_BASENAME_PREFIX=$(basename "$BUILT_APK" _arm64-v8a.apk)

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum "$(basename "$BUILT_APK")" > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha256sums failed."
          fi

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach sha256sums file
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
